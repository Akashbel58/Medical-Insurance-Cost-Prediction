
<!DOCTYPE html>
<html>
<head>
    <title>Medical Insurance Cost Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Medical Insurance Cost Prediction</h1>
    {% if error %}
        <p class="error">Error: {{ error }}</p>
    {% endif %}
    <form method="POST" action="/">
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="1" max="120">
        </div>
        
        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="bmi">BMI:</label>
            <input type="number" id="bmi" name="bmi" required step="0.01" min="10" max="50">
        </div>
        
        <div class="form-group">
            <label for="children">Number of Children:</label>
            <input type="number" id="children" name="children" required min="0" max="10">
        </div>
        
        <div class="form-group">
            <label for="smoker">Smoker:</label>
            <select id="smoker" name="smoker" required>
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="region">Region:</label>
            <select id="region" name="region" required>
                {% for region in regions %}
                    <option value="{{ region }}">{{ region|title }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit">Predict Insurance Cost</button>
    </form>
</body>
</html>
